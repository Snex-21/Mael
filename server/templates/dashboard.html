<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Mael</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }
        header {
            background: #18181c;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a30;
        }
        header h3 {
            font-size: 1.2rem;
            color: #ffffff;
        }
        .logout-btn {
            color: #ff6b6b;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            background: rgba(255, 107, 107, 0.1);
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: rgba(255, 107, 107, 0.2);
        }
        .container {
            padding: 30px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: #16161a;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #26262e;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: #5c5cff;
        }
        .card h4 {
            font-size: 1.1rem;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .card p {
            color: #9090a0;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .card-link {
            display: inline-block;
            background: #5c5cff;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            transition: background 0.2s;
        }
        .card-link:hover {
            background: #4a4aff;
        }

        @media (max-width: 480px) {
            header {
                padding: 12px 15px;
            }
            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<header>
    <h3>Mael Admin</h3>
    <a href="/logout" class="logout-btn">Cerrar sesión</a>
</header>

<div class="container">
    <div class="cards-grid">
        <div class="card">
            <div>
                <h4>Colección de Fotos</h4>
                <p>Ver, inspeccionar y gestionar las fotos almacenadas en el sistema.</p>
            </div>
            <a href="/admin/fotos" class="card-link">Ir a fotos ➡</a>
        </div>
    </div>
</div>

</body>
</html>
