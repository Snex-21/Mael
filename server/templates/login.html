<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Mael</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0f0f0f;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .box {
            background: #16161a;
            padding: 35px 30px;
            border-radius: 12px;
            border: 1px solid #26262e;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .box h2 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #ffffff;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            margin-top: 10px;
            background: #0f0f12;
            border: 1px solid #333340;
            border-radius: 6px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #5c5cff;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #5c5cff;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #4a4aff;
        }
    </style>
</head>
<body>
    <form method="POST" class="box">
        <h2>Panel Admin</h2>
        <input type="password" name="password" placeholder="Contraseña de administrador" required>
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
